name: Nhắc nhở (push)

# "Người đưa thư": cứ 30 phút chạy 1 lần, gửi nhắc nhở đến điện thoại đã bật.
# Cần secret FIREBASE_SERVICE_ACCOUNT (xem HUONG-DAN.md). Chưa có secret thì tự bỏ qua.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # Gửi thử: sửa file .github/notify-test.txt rồi đẩy lên.
  push:
    branches: [main]
    paths: [".github/notify-test.txt"]

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/notify.mjs ${{ github.event_name == 'push' && '--test' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
